[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaskteroids-lexxy"
version = "0.1.0"
description = "Packaged upstream Lexxy editor runtime and stylesheets"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT AND (Apache-2.0 OR MPL-2.0)"
license-files = ["LICENSE", "flaskteroids_lexxy/assets/*-LICENSE"]
authors = [{ name = "Juan Sebastian Quintero" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = []

[project.entry-points."flaskteroids.assets"]
lexxy = "flaskteroids_lexxy:PUBLIC_ASSETS"

[tool.setuptools.packages.find]
include = ["flaskteroids_lexxy", "flaskteroids_lexxy.*"]

[tool.setuptools.package-data]
flaskteroids_lexxy = ["assets/*"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.ruff]
target-version = "py314"
line-length = 88
force-exclude = true
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "B", "UP",
    "BLE001", "S110", "S112", "PLC0415", "PLW1510", "RUF012", "RUF022", "RUF100",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
